<!DOCTYPE html>
<html>
  <head>
    <title>Instant AR Target Shooter</title>
    <!-- Fully secured HTTPS tracking frameworks -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
    <script>
      // Detection component to handle shooting when objects are tapped
      AFRAME.registerComponent('shoot-target', {
        init: function () {
          this.el.addEventListener('click', function () {
            // Shrink target on hit
            this.setAttribute('animation__die', { property: 'scale', to: '0 0 0', dur: 150 });
            // Erase from 3D room environment
            setTimeout(() => { this.parentNode.removeChild(this); }, 150);
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- Activates the device webcam to display your room behind the targets -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- FIRST PERSON HUD: Glues gun and crosshair onto the phone viewport screen -->
      <a-camera raycaster="objects: .enemy" cursor="fuse: false; rayOrigin: mouse;">
        
          <a-box position="0 0.05 -0.2" scale="0.04 0.04 0.35" color="#1a1a1a"></a-box> <!-- Gun Barrel -->
          <a-box position="0 -0.06 0" scale="0.05 0.12 0.05" color="#2b2b2b"></a-box> <!-- Grip / Hands -->
        
        <a-ring radius-inner="0.01" radius-outer="0.018" position="0 0 -0.8" color="red" material="shader: flat"></a-ring>
      </a-camera>

      <!-- ENEMY TARGETS: Spawns targets in mid-air floating toward your coordinates -->
      
        <a-box color="#3b5936" scale="0.5 1.5 0.4"></a-box> <!-- Zombie Proxy Shape -->
        <a-sphere color="#ff0000" radius="0.07" position="0 0.6 0.2"></a-sphere>
      

      
        <a-box color="#3b5936" scale="0.5 1.5 0.4"></a-box>
        <a-sphere color="#ff0000" radius="0.07" position="0 0.6 0.2"></a-sphere>
      

    </a-scene>
  </body>
</html>
