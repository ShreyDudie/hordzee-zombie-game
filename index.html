<!DOCTYPE html>
<html>
  <head>
    <title>AR Hand Tracking Sandbox</title>
    <!-- Include A-Frame and high-precision browser tracking engines -->
    <script src="https://aframe.io"></script>
    <script src="https://jsdelivr.net"></script>
    <script>
      // Interaction system to simulate holding and grabbing objects
      AFRAME.registerComponent('hand-grab', {
        init: function () {
          this.isHolding = false;
          
          // Detect when user touches/holds down on a floating object
          this.el.addEventListener('mousedown', (evt) => {
            if (!this.isHolding) {
              this.isHolding = true;
              this.el.setAttribute('color', '#ffaa00'); // Change color to show it is selected
              
              // Anchor the 3D block dynamically to the front of the mobile camera view
              let camera = document.querySelector('[camera]');
              this.el.setAttribute('position', '0 -0.2 -1.5');
              camera.appendChild(this.el); 
            } else {
              // Tap it a second time to release and drop it back into the physical room space
              this.isHolding = false;
              this.el.setAttribute('color', '#4CC3D9');
              
              // Release object back down into global coordinates
              let scene = document.querySelector('a-scene');
              let camPos = new THREE.Vector3();
              camera.object3D.getWorldPosition(camPos);
              this.el.setAttribute('position', `${camPos.x} ${camPos.y - 0.4} ${camPos.z - 2}`);
              scene.appendChild(this.el);
            }
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- Pulls mobile webcam feed and maps high-performance orientation metrics -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- INTERACTIVE VIEWPANEL: Maps your screen focus for interaction mechanics -->
      <a-camera cursor="fuse: false; rayOrigin: mouse;">
        <a-ring radius-inner="0.015" radius-outer="0.025" position="0 0 -1" color="#ff00ff" material="shader: flat"></a-ring>
      </a-camera>

      <!-- PHYSICS OBJECTS: Virtual 3D blocks floating in the air that you can grab and move -->
      <a-box class="interactive" hand-grab position="-0.5 0 -2" rotation="0 45 0" color="#4CC3D9" scale="0.4 0.4 0.4"></a-box>
      <a-sphere class="interactive" hand-grab position="0.5 0.5 -2.5" radius="0.25" color="#EF2D5E"></a-sphere>
      <a-cylinder class="interactive" hand-grab position="0 -0.5 -3" radius="0.2" height="0.6" color="#FFC65D"></a-cylinder>

    </a-scene>
  </body>
</html>
